name: Assam Job Auto-Detector (Every 48 Hours)

on:
  workflow_dispatch:
  schedule:
    # Runs every 48 hours (every 2 days) at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 */2 * *'

jobs:
  sync-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Scraper Packages
        run: npm install @supabase/supabase-js

      - name: Run Job Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/auto-fetch-jobs.mjs
